<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gindi Studio</title>
<meta name="description" content="Gindi Studio — إدارة مشروعات التشطيب: العُهد، الاعتمادات، ميزانية البنود، الخزينة وكشف حساب العميل.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171A21" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* Base reset (matches the hosted-preview skeleton) */
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-size:14px;font-family:system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
img{max-width:100%}
[hidden]{display:none!important}
.tab,.seg button,.chip-btn{-webkit-user-select:none;user-select:none}

/* Layout: app shell — sticky top bar, side rail on wide screens, bottom tab bar on phones; cards only for objects you act on. */
:root{
  --bg:#F1F3F8; --surface:#FFFFFF; --surface-2:#F6F7FB; --ink:#0F1B33; --muted:#5B6576; --line:#DFE3EC;
  --brand:#0B3D91; --brand-ink:#FFFFFF; --brand-text:#0B3D91; --brand-soft:#E5ECF8;
  --gold:#9A7637; --gold-soft:#F5EDDC;
  --hero:#0B2E6B; --hero-ink:#FFFFFF; --hero-gold:#E6C88F; --hero-muted:#B9C6E0;
  --ok:#1C7448; --ok-soft:#E2F2E9; --warn:#9C5B00; --warn-soft:#FBEFD9; --bad:#B42318; --bad-soft:#FCE7E4;
  --font-ar:'Cairo','Manrope',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
  --font-en:'Manrope','Cairo',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;
  --radius:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101217; --surface:#171A21; --surface-2:#1D212A; --ink:#F2F2EE; --muted:#A5ABB6; --line:#2A2F3A;
  --brand:#2F65C8; --brand-ink:#FFFFFF; --brand-text:#8DB0F2; --brand-soft:rgba(47,101,200,.18);
  --gold:#D2B27A; --gold-soft:rgba(201,168,108,.14);
  --hero:#0E2A5E; --hero-ink:#FFFFFF; --hero-gold:#E6C88F; --hero-muted:#AFBDD8;
  --ok:#6FCF97; --ok-soft:rgba(111,207,151,.13); --warn:#F0B867; --warn-soft:rgba(240,184,103,.13); --bad:#FF8A80; --bad-soft:rgba(255,138,128,.13);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101217; --surface:#171A21; --surface-2:#1D212A; --ink:#F2F2EE; --muted:#A5ABB6; --line:#2A2F3A;
  --brand:#2F65C8; --brand-ink:#FFFFFF; --brand-text:#8DB0F2; --brand-soft:rgba(47,101,200,.18);
  --gold:#D2B27A; --gold-soft:rgba(201,168,108,.14);
  --hero:#0E2A5E; --hero-ink:#FFFFFF; --hero-gold:#E6C88F; --hero-muted:#AFBDD8;
  --ok:#6FCF97; --ok-soft:rgba(111,207,151,.13); --warn:#F0B867; --warn-soft:rgba(240,184,103,.13); --bad:#FF8A80; --bad-soft:rgba(255,138,128,.13);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ar);font-size:15px;line-height:1.6}
html[lang="en"] body{font-family:var(--font-en)}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate;display:inline-block}
h1,h2,h3{margin:0;line-height:1.3;text-wrap:balance}
a{color:var(--brand-text)}
:focus-visible{outline:2px solid var(--brand-text);outline-offset:2px}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1280px;margin:0 auto}
.mark{display:flex;flex-direction:column;line-height:1.05;margin-inline-end:auto;min-width:0}
.mark b{font-family:var(--font-en);font-weight:800;letter-spacing:.16em;font-size:15px;color:var(--brand-text)}
.mark span{font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.role>span{display:none}.mark span{display:none}}
.role{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.role select{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-weight:700;font-size:16px;color:var(--ink);max-width:46vw}
.chip-btn{border:1px solid var(--line);background:var(--surface-2);border-radius:999px;padding:6px 12px;font-weight:800;font-size:12px;cursor:pointer}

.shell{max-width:1280px;margin:0 auto;display:flex;gap:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 96px}
.rail{display:none}
main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.tabs{position:fixed;inset:auto 0 0 0;z-index:20;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 2px;border-radius:10px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;position:relative}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--brand-text)}
.tab .dot{position:absolute;top:2px;inset-inline-end:calc(50% - 20px);min-width:17px;height:17px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:17px;padding:0 4px}
@media (min-width:960px){
  .tabs{display:none}
  .shell{padding-block:24px 48px}
  .rail{display:flex;flex-direction:column;gap:4px;width:220px;flex:none;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:flex-start}
  .rail .tab{flex-direction:row;justify-content:flex-start;gap:10px;font-size:14px;padding:10px 12px}
  .rail .tab[aria-current="page"]{background:var(--brand-soft)}
  .rail .tab .dot{position:static;margin-inline-start:auto}
  .rail .foot{margin-top:16px;padding:12px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
}

.head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:800}
.head p{margin:2px 0 0;color:var(--muted);font-size:13px}
.eyebrow{font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--gold)}
.back{border:0;background:none;color:var(--brand-text);font-weight:700;cursor:pointer;padding:0;font-size:13px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid transparent;border-radius:10px;padding:9px 14px;font-weight:800;font-size:14px;cursor:pointer;background:var(--brand);color:var(--brand-ink);white-space:nowrap}
.btn svg{width:18px;height:18px}
a.btn{text-decoration:none}
.btn.ghost{background:var(--surface);color:var(--ink);border-color:var(--line)}
.btn.ok{background:var(--ok-soft);color:var(--ok)}
.btn.bad{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.block{width:100%}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:760px){.kpis{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);font-weight:700}
.kpi .v{font-size:21px;font-weight:800}
.kpi .s{font-size:12px;color:var(--muted)}
.kpi.warn{border-color:var(--warn);background:var(--warn-soft)}
.kpi.warn .v,.kpi.warn .l{color:var(--warn)}
.cur{font-size:12px;font-weight:700;color:var(--muted);margin-inline-start:3px}

.sec{display:flex;flex-direction:column;gap:10px}
.sec>h2{font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius)}
.rows>*+*{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;min-width:0}
.row .grow{flex:1;min-width:0}
.row .t{font-weight:700;overflow-wrap:anywhere}
.row .m{font-size:12.5px;color:var(--muted)}
.row .amt{font-weight:800;white-space:nowrap}
.row.click{cursor:pointer;width:100%;text-align:start;background:none;border-inline:0;border-bottom:0}
.row.click:first-child{border-top:0}
.row.click:hover{background:var(--surface-2)}
.empty{padding:22px 14px;text-align:center;color:var(--muted);font-size:13.5px}

.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:800;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)} .p-warn{background:var(--warn-soft);color:var(--warn)} .p-bad{background:var(--bad-soft);color:var(--bad)} .p-n{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)} .p-b{background:var(--brand-soft);color:var(--brand-text)}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;width:100%;text-align:start;background:none;border:0;cursor:pointer;border-inline-start:4px solid var(--warn)}
.alert.bad{border-inline-start-color:var(--bad)} .alert.info{border-inline-start-color:var(--brand-text)}
.alert:hover{background:var(--surface-2)}
.alert .t{font-weight:700;font-size:14px} .alert .m{font-size:12.5px;color:var(--muted)}

.grid{display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}
@media (min-width:760px){.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}}

.pcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:10px;text-align:start;cursor:pointer;min-width:0}
.pcard:hover{border-color:var(--brand-text)}
.pcard h3{font-size:16px;font-weight:800}
.pcard .meta{font-size:12.5px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--brand)}
.bar i.ok{background:var(--ok)} .bar i.warn{background:var(--warn)} .bar i.bad{background:var(--bad)}
.bar i.pend{background:repeating-linear-gradient(45deg,var(--warn) 0 4px,transparent 4px 8px);opacity:.8}
.split{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.split b{color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}

.hero{background:var(--hero);color:var(--hero-ink);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.hero .l{color:var(--hero-muted);font-size:13px;font-weight:700}
.hero .big{font-size:34px;font-weight:800;color:var(--hero-gold);line-height:1.1}
.hero .big .cur{color:var(--hero-muted)}
.hero .sub{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--hero-muted)}
.hero .sub b{color:var(--hero-ink)}
.hero .btn.ghost{background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.25)}
.hero .btn{background:var(--hero-gold);color:#1B1305}

.seg{display:flex;gap:4px;overflow-x:auto;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:12px;scrollbar-width:none}
.seg button{flex:none;border:0;background:none;padding:7px 12px;border-radius:9px;font-weight:700;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand-text)}

.bal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
@media (min-width:760px){.bal{grid-template-columns:repeat(4,minmax(0,1fr))}}
.bal>div{background:var(--surface);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.bal .l{font-size:12px;color:var(--muted);font-weight:700}
.bal .v{font-size:18px;font-weight:800;white-space:nowrap}
@media (max-width:520px){.bal .v{font-size:16px}}
.bal .neg{color:var(--bad)} .bal .pos{color:var(--ok)}

.item{padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.item .top2{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.item .top2 b{font-size:14.5px}

.feed{display:flex;flex-direction:column}
.fi{display:flex;gap:12px;padding:12px 14px}
.fi .av{flex:none;width:34px;height:34px;border-radius:50%;background:var(--gold-soft);color:var(--gold);display:grid;place-items:center;font-weight:800;font-size:13px}
.fi .m{font-size:12px;color:var(--muted)}

.stmt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
.stmt th{font-size:11.5px;color:var(--muted);text-align:start;font-weight:800;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.stmt td{padding:9px 12px;border-bottom:1px solid var(--line)}
.stmt td.n{text-align:end;white-space:nowrap}
.stmt tfoot td{font-weight:800;background:var(--surface-2)}
.scroll{overflow-x:auto}

.receipt-btn{flex:none;width:42px;height:42px;border-radius:9px;border:1px solid var(--line);background:var(--surface-2);display:grid;place-items:center;cursor:pointer;overflow:hidden;padding:0;color:var(--muted)}
.receipt-btn img{width:100%;height:100%;object-fit:cover}
.receipt-btn svg{width:20px;height:20px}

.scrim{position:fixed;inset:0;z-index:50;background:rgba(8,12,20,.55);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet{border-radius:18px;padding:22px}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{font-size:18px;font-weight:800}
.x{border:0;background:var(--surface-2);width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center}
.x svg{width:18px;height:18px}
form{display:flex;flex-direction:column;gap:12px}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12.5px;font-weight:800;color:var(--muted)}
.f input,.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px}
.f input[type=number]{font-variant-numeric:tabular-nums}
.f textarea{min-height:70px;resize:vertical}
.f2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:10px 12px}
.hint.warn{background:var(--warn-soft);color:var(--warn);font-weight:700}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:700}
.check input{width:18px;height:18px}
.rcpt{background:#FFFDF7;color:#2A2416;border-radius:6px;padding:18px;font-family:'Courier New',monospace;font-size:13px;display:flex;flex-direction:column;gap:6px;border:1px dashed #C9B98E}
.rcpt .c{text-align:center;font-weight:700}
.rcpt .ln{display:flex;justify-content:space-between;gap:8px}
.rcpt hr{border:0;border-top:1px dashed #C9B98E;margin:4px 0;width:100%}

.toast{position:fixed;z-index:60;inset-inline:0;bottom:calc(84px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;pointer-events:none;padding:0 16px}
.toast div{background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
@media (min-width:960px){.toast{bottom:24px}}
.demo-note{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease}@keyframes up{from{transform:translateY(16px);opacity:.6}}}

/* Install banner (app only) */
.install{display:flex;align-items:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--gold-soft);color:var(--ink);border-bottom:1px solid var(--line);font-size:13.5px}
.install p{margin:0;flex:1;min-width:0}
.install b{color:var(--gold)}
</style>
</head>

<div id="modal"></div>

function load(){try{const s=localStorage.getItem(KEY);if(s){const d=JSON.parse(s);if(d&&d.projects)return d}}catch(e){}return seed()}

let D=load();
D.tx.forEach((t,i)=>{if(!t.id)t.id='t'+i});D.tasks.forEach((t,i)=>{if(!t.id)t.id='k'+i});
const S={lang:pref('lang')||'ar',role:pref('role')||'manager',view:null,pid:null,ptab:'overview',taskF:'open'};
const ME={manager:'mgr',office:'noha',site:'karim',client:'hisham'};
const ROLE_TABS={manager:['home','projects','approvals','custody','treasury'],office:['home','projects','tasks','approvals'],site:['site','tasks','projects'],client:['client','statement']};

// ---------- helpers ----------
const t=(k,vars)=>{let s=(L[k]||[k,k])[S.lang==='ar'?0:1];if(vars)for(const v in vars)s=s.split('{'+v+'}').join(vars[v]);return s};
const tx=v=>v==null?'':typeof v==='string'?v:(v[S.lang]||v.ar);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const X=v=>esc(tx(v));
const nf=new Intl.NumberFormat('en-US',{maximumFractionDigits:0});
const n=v=>`<span class="num">${nf.format(Math.round(v))}</span>`;
const money=v=>`${n(v)}<span class="cur">${t('egp')}</span>`;
const plain=v=>`${nf.format(Math.round(v))} ${t('egp')}`;
const itemName=k=>ITEMS[k]?ITEMS[k][S.lang==='ar'?0:1]:k;
const person=id=>D.people[id]?tx(D.people[id].name):id;
const initial=id=>{const nm=tx(D.people[id]?.name||'');const parts=nm.replace(/^(م\.|أ\.|د\.|Eng\.|Mr\.|Dr\.)\s*/,'').split(' ');return (parts[0]||'?').slice(0,1)};
const accName=id=>t('acc_'+id);
const P=id=>D.projects.find(p=>p.id===id);
const todayISO=new Date().toISOString().slice(0,10);
function fdate(iso){if(iso===todayISO)return t('today');if(iso===day(1))return t('yesterday');const d=new Date(iso+'T00:00:00');return d.toLocaleDateString(S.lang==='ar'?'ar-EG-u-nu-latn':'en-GB',{day:'numeric',month:'short'})}
const exps=(f={})=>D.tx.filter(x=>x.kind==='exp'&&(!f.project||x.project===f.project)&&(!f.status||x.status===f.status)&&(!f.by||x.by===f.by));
const sum=a=>a.reduce((s,x)=>s+x.amount,0);
const spent=p=>sum(exps({project:p.id,status:'approved'}));
const pendingP=p=>sum(exps({project:p.id,status:'pending'}));
const paidP=p=>sum(D.tx.filter(x=>x.kind==='pay'&&x.project===p.id));
const feeP=p=>p.fee.type==='pct'?spent(p)*p.fee.v/100:p.fee.v*p.progress/100;
const balP=p=>paidP(p)-spent(p)-feeP(p);
const itemSpent=(p,k,st='approved')=>sum(exps({project:p.id,status:st}).filter(x=>x.item===k));
const budgetP=p=>p.items.reduce((s,i)=>s+i[1],0);
function engStats(id){
  const give=sum(D.tx.filter(x=>x.kind==='give'&&x.eng===id));
  const xin=sum(D.tx.filter(x=>x.kind==='xfer'&&x.to===id)), xout=sum(D.tx.filter(x=>x.kind==='xfer'&&x.from===id));
  const ret=sum(D.tx.filter(x=>x.kind==='ret'&&x.eng===id));
  const sp=sum(exps({by:id,status:'approved'})), pend=sum(exps({by:id,status:'pending'}));
  const bal=give+xin-xout-ret-sp;
  return {given:give+xin-xout,ret,spent:sp,pend,bal,after:bal-pend};
}
function accBal(a){
  let b=a.open;
  D.tx.forEach(x=>{
    if(x.kind==='pay'&&x.acc===a.id)b+=x.amount;
    if(x.kind==='give'&&x.acc===a.id)b-=x.amount;
    if(x.kind==='ret'&&x.acc===a.id)b+=x.amount;
    if(x.kind==='exp'&&x.acc===a.id&&x.status==='approved')b-=x.amount;
  });
  return b;
}
const siteEngs=()=>Object.keys(D.people).filter(k=>D.people[k].role==='site');
const staff=()=>Object.keys(D.people).filter(k=>['site','office'].includes(D.people[k].role));
const isLate=k=>k.status!=='done'&&k.due<todayISO;
const pctClass=(s,b)=>s>b?'bad':s>=b*.85?'warn':'ok';

function alerts(){
  const out=[];
  const pend=exps({status:'pending'});
  if(pend.length&&S.role!=='site')out.push({lvl:'info',t:t('a_pending',{n:pend.length}),m:t('a_pendingM',{v:plain(sum(pend))}),go:{view:'approvals'}});
  D.projects.forEach(p=>{
    if(balP(p)<0)out.push({lvl:'bad',t:t('a_owes',{v:plain(-balP(p))}),m:t('a_owesM',{p:tx(p.name)}),go:{view:'project',pid:p.id,ptab:'statement'}});
    p.items.forEach(([k,b])=>{const s=itemSpent(p,k);if(s>b)out.push({lvl:'warn',t:t('a_over',{i:itemName(k)}),m:t('a_overM',{p:tx(p.name),s:plain(s),b:plain(b)}),go:{view:'project',pid:p.id,ptab:'budget'}})});
  });
  siteEngs().forEach(e=>{const s=engStats(e);if(s.after<0)out.push({lvl:'warn',t:t('a_short',{e:person(e)}),m:t('a_shortM',{v:plain(-s.after)}),go:{view:'custody'}})});
  const late=D.tasks.filter(isLate).sort((a,b)=>a.due<b.due?-1:1);
  if(late.length)out.push({lvl:'warn',t:t('a_late',{n:late.length}),m:t('a_lateM',{t:tx(late[0].title)}),go:{view:'tasks',taskF:'open'}});
  return out;
}

function stmtRows(p,forClient){
  const rows=[];
  D.tx.filter(x=>x.project===p.id&&(x.kind==='pay'||(x.kind==='exp'&&x.status==='approved'))).sort((a,b)=>a.date<b.date?-1:1).forEach(x=>rows.push(x));
  let run=0;
  const body=rows.map(x=>{const cr=x.kind==='pay'?x.amount:0,dr=x.kind==='exp'?x.amount:0;run+=cr-dr;
    return `<tr><td>${fdate(x.date)}</td><td>${x.kind==='pay'?`${t('clientPay')} — ${X(x.note)}`:`${itemName(x.item)} — ${X(x.note)}`}</td><td class="n">${dr?n(dr):''}</td><td class="n">${cr?n(cr):''}</td><td class="n">${n(run)}</td></tr>`}).join('');

}

  const body=x.receipt&&x.receipt!=='sample'?`<img src="${x.receipt}" alt="${t('receipt')}" style="border-radius:8px">`:x.receipt==='sample'?`<div class="rcpt"><div class="c">${X(x.vendor||'')}</div><div class="c" style="font-size:11px">${fdate(x.date)}</div><hr><div class="ln"><span>${X(x.note)}</span></div><div class="ln"><span>${itemName(x.item)}</span><span>${X(p.name)}</span></div><hr><div class="ln"><b>${t('totals')}</b><b>${plain(x.amount)}</b></div><div class="c" style="font-size:11px;margin-top:6px">— sample receipt —</div></div>`:`<div class="empty">${t('noReceipt')}</div>`;
  modal(t('receipt'),body+`<div class="split"><span>${x.by?t('fromCustody',{e:person(x.by)}):t('fromAcc',{a:accName(x.acc)})}</span>${statusPill(x.status)}</div>`)}

function readImg(file){return new Promise(res=>{if(!file||!file.size)return res(null);const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const s=Math.min(1,700/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};img.onerror=()=>res(null);img.src=r.result};r.onerror=()=>res(null);r.readAsDataURL(file)})}

let toastT;function toast(m){$('toast').innerHTML=`<div>${esc(m)}</div>`;clearTimeout(toastT);toastT=setTimeout(()=>$('toast').innerHTML='',2600)}
const nid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,5);

// ---------- events ----------
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,id=el.dataset.id;
  if(a==='close-scrim'&&e.target!==el)return;
  switch(a){
    case 'nav':go({view:el.dataset.view});break;
    case 'open':go({view:'project',pid:id,ptab:'overview'});break;
    case 'ptab':S.ptab=el.dataset.tab;render();break;
    case 'taskF':S.taskF=el.dataset.f;render();break;
    case 'alert':{const al=alerts()[+el.dataset.i];if(al)go(al.go);break}
    case 'lang':S.lang=S.lang==='ar'?'en':'ar';pref('lang',S.lang);closeModal();render();break;
    case 'reset':D=seed();D.tx.forEach((x,i)=>x.id='t'+i);D.tasks.forEach((x,i)=>x.id='k'+i);save();render();toast(t('resetDone'));break;
    case 'approve':case 'reject':{const x=D.tx.find(y=>y.id===id);if(x){x.status=a==='approve'?'approved':'rejected';save();render();toast(t(a==='approve'?'didApprove':'didReject'))}break}
    case 'tdone':case 'tstart':{const k=D.tasks.find(y=>y.id===id);if(k){k.status=a==='tdone'?'done':'doing';save();render();toast(t(a==='tdone'?'didDone':'didStart'))}break}
    case 'receipt':mReceipt(id);break;
    case 'm-exp':mExp();break;
    case 'm-give':mGive(id);break;
    case 'm-xfer':mXfer();break;
    case 'm-ret':mRet(id);break;
    case 'm-pay':mPay();break;
    case 'm-task':mTask(id);break;
    case 'm-prog':mProg(id);break;
    case 'close':case 'close-scrim':closeModal();break;
    case 'copy':{const p=P(id),txt=summaryText(p,el.dataset.client==='1');try{await navigator.clipboard.writeText(txt);toast(t('copied'))}catch(err){modal(t('copy'),`<textarea readonly style="width:100%;min-height:160px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px">${esc(txt)}</textarea>`);const ta=$('modal').querySelector('textarea');ta.focus();ta.select();toast(t('copyFail'))}break}
  }
});
document.addEventListener('change',e=>{
  const c=e.target.dataset.change;if(!c)return;
  if(c==='role'){S.role=e.target.value;pref('role',S.role);S.view=null;closeModal();render();window.scrollTo({top:0})}
  if(c==='expProject'){$('eItem').innerHTML=itemOpts(e.target.value);expCheck()}
  if(c==='expCheck')expCheck();
  if(c==='progProject'){const p=P(e.target.value);$('gVal').value=p.progress;$('gOut').textContent=p.progress+'%'}
});
document.addEventListener('input',e=>{const c=e.target.dataset.input;if(c==='expCheck')expCheck();if(c==='progOut')$('gOut').textContent=e.target.value+'%'});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('modal').innerHTML)closeModal()});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const v=Object.fromEntries(new FormData(f));const kind=f.dataset.form;const amt=+v.amount;
  const needAmt=['exp','give','xfer','ret','pay'].includes(kind);
  if(needAmt&&!(amt>0)){toast(t('needAmount'));return}
  const date=todayISO;
  if(kind==='exp'){
    const site=S.role==='site';const rc=await readImg(f.receipt.files[0]);
    D.tx.push({id:nid('t'),kind:'exp',date,project:v.project,item:v.item,amount:amt,by:site?ME.site:undefined,acc:site?undefined:v.acc,status:site?'pending':'approved',receipt:rc,vendor:v.vendor||'',note:v.note||itemName(v.item)});
    toast(t(site?'didLog':'didDirect'));
  }
  if(kind==='give'){D.tx.push({id:nid('t'),kind:'give',date,eng:v.eng,amount:amt,acc:v.acc});toast(t('didGive'))}
  if(kind==='xfer'){if(v.from===v.to){toast(t('sameEng'));return}D.tx.push({id:nid('t'),kind:'xfer',date,from:v.from,to:v.to,amount:amt});toast(t('didXfer'))}
  if(kind==='ret'){D.tx.push({id:nid('t'),kind:'ret',date,eng:v.eng,amount:amt,acc:v.acc});toast(t('didRet'))}
  if(kind==='pay'){D.tx.push({id:nid('t'),kind:'pay',date,project:v.project,amount:amt,acc:v.acc,note:v.note||t('clientPay')});toast(t('didPay'))}
  if(kind==='task'){if(!v.title.trim()){toast(t('needTitle'));return}D.tasks.push({id:nid('k'),project:v.project,type:v.type,title:v.title.trim(),who:v.who,due:v.due,status:'todo'});toast(t('didAddTask'))}
  if(kind==='prog'){const p=P(v.project);p.progress=+v.progress;D.updates.push({project:p.id,by:ME[S.role]==='hisham'?'karim':ME[S.role],date,progress:p.progress,note:v.note||`${t('progress')} ${p.progress}%`});toast(t('didProg'))}
  if(kind==='fee'){const p=P(f.dataset.id);p.fee={type:v.type,v:Math.max(0,+v.v||0)};p.showFee=!!v.show;toast(t('saved'))}
  save();closeModal();render();
});
render();
})();
</script>

<script>
// App shell: offline support + "add to home screen" prompt.
(function(){
  if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
  var standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  var dismissed=false;try{dismissed=localStorage.getItem('gindi-studio-install-dismissed')==='1'}catch(e){}
  if(standalone||dismissed)return;
  var ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
  var deferred=null,bar=null;
  var T={
    ios:['ثبّت التطبيق: اضغط زر <b>مشاركة</b> في سفاري ثم <b>إضافة إلى الشاشة الرئيسية</b>.','Install the app: tap <b>Share</b> in Safari, then <b>Add to Home Screen</b>.'],
    android:['ثبّت Gindi Studio على موبايلك ليفتح كتطبيق.','Install Gindi Studio on your phone so it opens like an app.'],
    install:['تثبيت','Install'],close:['إخفاء','Dismiss']
  };
  function tr(k){return T[k][document.documentElement.lang==='en'?1:0]}
  function show(kind){
    if(bar)bar.remove();
    bar=document.createElement('div');bar.className='install';bar.setAttribute('role','region');
    bar.innerHTML='<p>'+tr(kind)+'</p>'+(kind==='android'?'<button class="btn sm" data-i="go">'+tr('install')+'</button>':'')+'<button class="btn ghost sm" data-i="x">'+tr('close')+'</button>';
    var top=document.querySelector('.top');top.appendChild(bar);
    bar.addEventListener('click',function(e){var b=e.target.closest('[data-i]');if(!b)return;
      if(b.dataset.i==='go'&&deferred){deferred.prompt();deferred.userChoice.finally(function(){deferred=null;bar.remove()})}
      if(b.dataset.i==='x'){bar.remove();try{localStorage.setItem('gindi-studio-install-dismissed','1')}catch(e){}}
    });
    shown=kind;
  }
  var shown=null;
  new MutationObserver(function(){if(bar&&bar.isConnected&&shown)show(shown)}).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
  window.addEventListener('beforeinstallprompt',function(e){e.preventDefault();deferred=e;show('android')});
  if(ios)show('ios');
})();
</script>
